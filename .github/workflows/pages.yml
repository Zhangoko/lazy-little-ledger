name: Publish Lazy Little Ledger
on:
  push:
    branches: [main]
    paths:
      - 'lazy-little-ledger-source*.zip'
      - '.github/workflows/pages.yml'
      - 'site-update.json'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Unpack the website source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          preferred = Path('lazy-little-ledger-source.zip')
          archives = list(Path('.').glob('lazy-little-ledger-source*.zip'))
          if preferred.exists():
              source = preferred
          elif len(archives) == 1:
              source = archives[0]
          else:
              raise SystemExit('Upload one source archive, or use lazy-little-ledger-source.zip')
          print('Deploying source archive:', source.name)
          with ZipFile(source) as archive:
              archive.extractall('.')
          PY
      - name: Apply approved text update
        run: |
          python3 - <<'PY'
          import json, gzip, base64, hashlib
          from pathlib import Path
          update = Path('site-update.json')
          if update.exists():
              payload = json.loads(update.read_text())
              raw = gzip.decompress(base64.b64decode(payload['data'], validate=True))
              assert hashlib.sha256(raw).hexdigest() == payload['sha256'], 'Update checksum mismatch'
              for name, text in json.loads(raw).items():
                  path = Path(name)
                  assert not path.is_absolute() and '..' not in path.parts
                  assert name.startswith('dist/') or name in ('README.md', 'AGENTS.md')
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_text(text, encoding='utf-8')
          PY
      - name: Verify ledger logic
        run: npm test
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
