name: Publish Lazy Little Ledger
on:
  push:
    branches: [main]
    paths:
      - lazy-little-ledger-source.zip
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Unpack the website source
        run: python3 -m zipfile -e lazy-little-ledger-source.zip .
      - name: Verify ledger logic
        run: npm test
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
